<!doctype html>
<meta charset="utf-8">
<title>紙のコマ撮り風の5秒</title>
<style>
  @font-face { font-family: "Zen"; font-weight: 900; src: url("../zero/fonts/ZenMaruGothic-Black.ttf"); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// 紙細工の絵（背景・キャラクターのポーズ3つ・手前・星）を重ねて、コマ撮り風に動かす（2026-11-17。boot_camp の docs/28）
// seek(t) で、t 秒の所の1コマを描く。make.mjs が、1コマずつ撮って動画にする
// コマ撮りらしさ: キャラクターと星は「1秒12コマ」でかくかく動かし、置き直したような小さなずれを入れる。カメラはなめらかに寄る
const W = 1280, H = 720, c = document.getElementById("c"), g = c.getContext("2d");
const DIR = "../../boot_camp/tools/douga/work/";
const L = {};          // 切り抜いたあとの絵
const T = { b: 1.7, c: 3.2, end: 5 };   // ポーズが変わる時刻: a → b（ごっくん）→ c（できた）

// 緑の無地を消す。絵のふちからつながっている「地の色に近い所」を消し、囲まれた所も、地の色にごく近ければ消す。ふちの緑のにじみも取る
function keyOut(img) {
  const w = img.naturalWidth, h = img.naturalHeight, cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const x = cv.getContext("2d"); x.drawImage(img, 0, 0);
  const im = x.getImageData(0, 0, w, h), d = im.data, n = w * h;
  // 地の色は、絵の上のはしの7か所の、まん中の値（下のすみには、木や草があることがあるので、上だけを見る）
  const pts = [0.02, 0.18, 0.34, 0.5, 0.66, 0.82, 0.98].map((f) => (4 * w + Math.min(w - 1, Math.round(f * w))) * 4);
  const med = (o) => pts.map((i) => d[i + o]).sort((a, b) => a - b)[3];
  const br = med(0), bg = med(1), bb = med(2);
  const dist = new Uint8Array(n);
  for (let i = 0; i < n; i++) dist[i] = Math.min(255, Math.max(Math.abs(d[i * 4] - br), Math.abs(d[i * 4 + 1] - bg), Math.abs(d[i * 4 + 2] - bb)));
  const out = new Uint8Array(n), st = [];
  const push = (i) => { if (!out[i] && dist[i] <= 60) { out[i] = 1; st.push(i); } };
  for (let px = 0; px < w; px++) { push(px); push((h - 1) * w + px); }
  for (let py = 0; py < h; py++) { push(py * w); push(py * w + w - 1); }
  while (st.length) { const i = st.pop(), px = i % w; if (px > 0) push(i - 1); if (px < w - 1) push(i + 1); if (i >= w) push(i - w); if (i < n - w) push(i + w); }
  for (let i = 0; i < n; i++) if (dist[i] <= 22) out[i] = 1;
  for (let i = 0; i < n; i++) {
    if (out[i]) { d[i * 4 + 3] = 0; continue; }
    // ふち（となりが消えた所）は半分すかして、緑を弱める
    const px = i % w, near = (px > 0 && out[i - 1]) || (px < w - 1 && out[i + 1]) || (i >= w && out[i - w]) || (i < n - w && out[i + w]);
    const r = d[i * 4], gg = d[i * 4 + 1], b = d[i * 4 + 2], spill = gg - Math.max(r, b);
    if (near) d[i * 4 + 3] = 150;
    if (spill > 6) { d[i * 4 + 1] = Math.max(r, b) + Math.round(spill * 0.12); if (spill > 45) d[i * 4 + 3] = Math.min(d[i * 4 + 3], 120); }
  }
  x.putImageData(im, 0, 0);
  // 中身のある所だけを切り出す（置く位置を、ポーズの間でそろえやすくするため、切り出した枠も覚える）
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let i = 0; i < n; i++) if (d[i * 4 + 3] > 40) { const px = i % w, py = (i / w) | 0; if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py; }
  return { cv, w, h, box: [x0, y0, x1 - x0 + 1, y1 - y0 + 1] };
}
const load = (name) => new Promise((ok, ng) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ng(new Error("読めない: " + name)); im.src = DIR + name + ".png"; });
async function setup() {
  const bg = await load("kp_bg"); L.bg = { cv: bg, w: bg.naturalWidth, h: bg.naturalHeight };
  for (const n of ["kp_a", "kp_b", "kp_c", "kp_fg", "kp_star"]) L[n] = keyOut(await load(n));
  await document.fonts.load('900 40px "Zen"');
  return Object.fromEntries(Object.entries(L).map(([k, v]) => [k, [v.w, v.h, ...(v.box || [])].join(",")]));
}

// 同じ番号なら、いつも同じ値になる、でたらめな数（コマ撮りの「置き直しのずれ」に使う）
const rnd = (i, s) => { const v = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return v - Math.floor(v); };
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
const seg = (t, a, b) => ease((t - a) / (b - a));

// 奥行き: カメラが寄るとき、奥の絵ほど少ししか大きくならず、手前ほど大きく動く
function layer(depth, t, draw) {
  const z = 1 + 0.085 * ease(t / T.end) * depth, panX = -14 * ease(t / T.end) * depth, panY = 6 * ease(t / T.end) * depth;
  g.save(); g.translate(W / 2 + panX, H * 0.56 + panY); g.scale(z, z); g.translate(-W / 2, -H * 0.56); draw(); g.restore();
}
function cover(l, extra) {   // 画面いっぱいに（少し大きめに）敷く
  const s = Math.max(W / l.w, H / l.h) * extra, w = l.w * s, h = l.h * s;
  g.drawImage(l.cv, (W - w) / 2, (H - h) / 2, w, h);
}
function paperStar(x, y, r, rot, a) {   // 紙の小さな星（きらきら）
  g.save(); g.globalAlpha = a; g.translate(x, y); g.rotate(rot);
  g.shadowColor = "rgba(40,30,10,.35)"; g.shadowBlur = 5; g.shadowOffsetY = 3;
  g.fillStyle = "#ffe89a"; g.beginPath();
  for (let i = 0; i < 8; i++) { const rr = i % 2 ? r * 0.36 : r, an = (i * Math.PI) / 4; g.lineTo(Math.sin(an) * rr, -Math.cos(an) * rr); }
  g.closePath(); g.fill(); g.restore();
}
function word(str, t, t0) {   // かけ声の文字。ぽんと出る
  const p = seg(t, t0, t0 + 0.18), out = 1 - seg(t, t0 + 1.15, t0 + 1.35); if (p <= 0 || out <= 0) return;
  const s = 0.6 + 0.4 * p + 0.12 * Math.sin(Math.min(1, (t - t0) / 0.3) * Math.PI);
  g.save(); g.globalAlpha = Math.min(p, out); g.translate(905, 395); g.scale(s, s); g.rotate(-0.05);
  g.font = '900 86px "Zen"'; g.textAlign = "center"; g.textBaseline = "middle"; g.lineJoin = "round";
  g.shadowColor = "rgba(20,15,40,.45)"; g.shadowBlur = 10; g.shadowOffsetY = 6;
  g.strokeStyle = "#3b2a20"; g.lineWidth = 16; g.strokeText(str, 0, 0);
  g.shadowColor = "transparent"; g.fillStyle = "#fff6dc"; g.fillText(str, 0, 0); g.restore();
}

function seek(t) {
  const f12 = Math.floor(t * 12), tq = f12 / 12;   // キャラクターと星は、1秒12コマ
  g.clearRect(0, 0, W, H);
  // 1. 背景（いちばん奥）
  layer(0.45, t, () => cover(L.bg, 1.1));
  // 2. ひもでつるした紙の星（ゆれる）
  layer(0.75, t, () => {
    [[215, 170, 50, 0.0], [905, 150, 42, 1.6], [640, 70, 32, 3.0]].forEach(([x, len, r, ph], i) => {
      const an = 0.11 * Math.sin(tq * 2.3 + ph) + (rnd(f12, i) - 0.5) * 0.02;
      g.save(); g.translate(x, -20); g.rotate(an);
      g.strokeStyle = "rgba(255,246,220,.55)"; g.lineWidth = 2; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, len + 20); g.stroke();
      g.shadowColor = "rgba(10,10,40,.45)"; g.shadowBlur = 8; g.shadowOffsetY = 5;
      const b = L.kp_star.box; g.translate(0, len + 20 + r * 0.8); g.rotate(0.25 * Math.sin(tq * 1.7 + ph));
      g.drawImage(L.kp_star.cv, b[0], b[1], b[2], b[3], -r, -r, r * 2, r * 2 * (b[3] / b[2]));
      g.restore();
    });
  });
  // 3. キャラクター（ポーズを入れかえる）
  layer(1.0, t, () => {
    const pose = tq < T.b ? "kp_a" : tq < T.c ? "kp_b" : "kp_c", p = L[pose], since = tq - (pose === "kp_a" ? 0 : pose === "kp_b" ? T.b : T.c);
    // 大きさは、ポーズ a の体の高さを 400px にそろえる。位置は、もとの絵の中の位置のまま（3枚は同じ位置に描いてもらっている）
    const sc = 400 / L.kp_a.box[3], cx = 500, footY = 628;
    const ax = L.kp_a.box[0] + L.kp_a.box[2] / 2, ay = L.kp_a.box[1] + L.kp_a.box[3];   // ポーズ a の足もとのまん中
    let dy = 0, sx = 1, sy = 1, rot = (rnd(f12, 9) - 0.5) * 0.012, jx = (rnd(f12, 3) - 0.5) * 2.4, jy = (rnd(f12, 4) - 0.5) * 2.0;
    if (pose === "kp_a") { dy = -4 * Math.abs(Math.sin(tq * 3.4)); if (tq > T.b - 0.34) { sy = 0.95; sx = 1.04; } }   // 小さくゆれる。ごっくんの前に、少しちぢむ
    if (pose === "kp_b") { const k = Math.max(0, 1 - since / 0.25); sy = 1 + 0.07 * k; sx = 1 - 0.04 * k; rot += -0.03 * Math.min(1, since / 0.5); dy = -3 * Math.sin(Math.min(1, since / 1.2) * Math.PI); }   // のびて、少しのけぞる
    if (pose === "kp_c") { const h = (since % 0.66) / 0.66; dy = since < 1.32 ? -46 * 4 * h * (1 - h) : 0; const land = since < 1.32 && h < 0.12; sy = land ? 0.93 : 1; sx = land ? 1.06 : 1; }   // 2回、ぴょんととぶ
    // 足もとの影
    g.save(); g.fillStyle = "rgba(10,20,40,.28)"; g.beginPath(); g.ellipse(cx, footY + 6, 118 * (1 + dy / 300), 17, 0, 0, Math.PI * 2); g.fill(); g.restore();
    g.save(); g.translate(cx + jx, footY + jy + dy); g.rotate(rot); g.scale(sc * sx, sc * sy);
    g.shadowColor = "rgba(10,10,40,.42)"; g.shadowBlur = 18; g.shadowOffsetY = 10; g.shadowOffsetX = 4;
    g.drawImage(p.cv, -ax, -ay);
    g.restore();
    // きらきら（ごっくんの所と、できたの所）
    if (pose === "kp_b") [[-150, -300], [165, -330], [-120, -180]].forEach(([x, y], i) => { const a = Math.sin(Math.min(1, Math.max(0, since - i * 0.16) / 0.9) * Math.PI); if (a > 0) paperStar(cx + x, footY + y - since * 20, 16 + i * 3, tq * 2 + i, a); });
    if (pose === "kp_c") for (let i = 0; i < 9; i++) { const an = (i / 9) * Math.PI * 2 + 0.3, k = seg(since, i * 0.03, 0.55 + i * 0.03), a = k * (1 - seg(since, 1.2, 1.7)); if (a > 0) paperStar(cx + Math.cos(an) * (120 + 150 * k), footY - 250 + Math.sin(an) * (90 + 120 * k), 13 + (i % 3) * 6, tq * 2.5 + i, a); }
  });
  // 4. 手前の草とランタン（いちばん手前。大きく動く）
  layer(1.7, t, () => { g.save(); g.shadowColor = "rgba(5,5,30,.5)"; g.shadowBlur = 22; g.shadowOffsetY = 8; g.translate((rnd(f12, 5) - 0.5) * 1.2, 26); cover(L.kp_fg, 1.12); g.restore(); });
  // 5. かけ声の文字
  word("せーの", t, 0.45); word("ごっくん", t, T.b + 0.05); word("できた！", t, T.c + 0.05);
  // 6. 画面のはしを少し暗くする
  const v = g.createRadialGradient(W / 2, H * 0.52, H * 0.45, W / 2, H * 0.52, H * 0.95); v.addColorStop(0, "rgba(0,0,20,0)"); v.addColorStop(1, "rgba(0,0,20,.42)"); g.fillStyle = v; g.fillRect(0, 0, W, H);
}
</script>
