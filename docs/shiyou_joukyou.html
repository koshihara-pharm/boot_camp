<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>使用状況の記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  /* 使用状況（Clarity と GA4）を見た日ごとにためるページ。上にいちばん新しい記録、下に推移の表と前の記録。
     見方は docs/26。記録を足すときは、下の RECORDS のいちばん上に1件足すだけ */
  :root {
    --bg: #eef6f4;
    --card: #ffffff;
    --text: #1f2d2b;
    --muted: #5d6e6b;
    --line: #d3e3df;
    --accent: #1f7a70;
    --accent-soft: #d9eee8;
    --bar: #1f7a70;
    --bar-bg: #e3efec;
    --up: #2f7d4f;
    --down: #b3412f;
    --warn: #8a6400; --warn-bg: #fff2c4;
    --idea: #2a5d9f; --idea-bg: #e4ecf8;
    /* グラフの2色（dataviz の基準の1番目と2番目。色の見分けの検査に通した） */
    --s1: #2a78d6; --s2: #eb6834; --grid: #e3ebe9;
    --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    --font-body: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #142120; --card: #1d2c2a; --text: #e8f1ef; --muted: #a3b5b1; --line: #2f4340; --accent: #6cc7b9; --accent-soft: #1f3936;
      --bar: #6cc7b9; --bar-bg: #26302e; --up: #8fd6a9; --down: #f0a090;
      --warn: #f2c14e; --warn-bg: #3a3120; --idea: #9cc0f0; --idea-bg: #1f2b3d;
      --s1: #3987e5; --s2: #d95926; --grid: #2a3b38;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #142120; --card: #1d2c2a; --text: #e8f1ef; --muted: #a3b5b1; --line: #2f4340; --accent: #6cc7b9; --accent-soft: #1f3936;
    --bar: #6cc7b9; --bar-bg: #26302e; --up: #8fd6a9; --down: #f0a090;
    --warn: #f2c14e; --warn-bg: #3a3120; --idea: #9cc0f0; --idea-bg: #1f2b3d;
    --s1: #3987e5; --s2: #d95926; --grid: #2a3b38;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* 日ごとのグラフ */
  .chart-card { position: relative; }
  .legend { display: flex; gap: 16px; font-size: 13px; margin: 2px 0 6px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .col { cursor: pointer; }
  .chart .axis { fill: var(--muted); font-size: 11px; }
  .chart .total { fill: var(--text); font-size: 11px; font-weight: 700; }
  .chart .col:hover .hl, .chart .col:focus .hl { fill: var(--accent-soft); }
  .chart .col:focus { outline: none; }
  .tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.6; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; display: none; z-index: 2; }
  .tip b { font-family: var(--font-display); }
  .tip i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  .chart-note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  details.table-view { margin-top: 8px; font-size: 13px; }
  details.table-view summary { cursor: pointer; color: var(--accent); font-weight: 700; }
  details.table-view table { margin-top: 6px; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  h1, h2, h3 { font-family: var(--font-display); line-height: 1.4; margin: 0; }
  h1 { font-size: 24px; }
  h2 { font-size: 18px; margin: 28px 0 10px; }
  h3 { font-size: 15px; margin-bottom: 8px; }
  .lead { color: var(--muted); font-size: 13px; margin: 4px 0 14px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .links a { display: inline-block; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 700; }
  .links a:hover { background: var(--accent-soft); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .date { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--accent); }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0 4px; }
  @media (min-width: 600px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .tile .label { font-size: 12px; color: var(--muted); }
  .tile .num { font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.2; }
  .tile .unit { font-size: 14px; margin-left: 2px; }
  .tile .sub { font-size: 11px; color: var(--muted); }
  .delta { font-size: 12px; font-weight: 700; }
  .delta.up { color: var(--up); } .delta.down { color: var(--down); } .delta.same, .delta.first { color: var(--muted); }
  .bars { display: grid; gap: 6px; }
  .bar-row { display: grid; grid-template-columns: 9em 1fr 2.6em; align-items: center; gap: 8px; font-size: 13px; }
  .bar-row .name { line-height: 1.35; overflow-wrap: anywhere; }
  .bar-track { background: var(--bar-bg); border-radius: 6px; height: 14px; overflow: hidden; }
  .bar-fill { background: var(--bar); height: 100%; border-radius: 6px; }
  .bar-row .n { text-align: right; font-variant-numeric: tabular-nums; }
  .period { font-size: 11px; color: var(--muted); margin: -4px 0 8px; }
  .grid2 { display: grid; gap: 12px; }
  @media (min-width: 600px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  .note { border-left: 4px solid var(--line); padding: 2px 0 2px 12px; margin: 12px 0; }
  .note .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; margin-right: 6px; vertical-align: 2px; }
  .note.kasetsu { border-color: var(--idea); } .note.kasetsu .tag { color: var(--idea); background: var(--idea-bg); }
  .note.kadai { border-color: var(--warn); } .note.kadai .tag { color: var(--warn); background: var(--warn-bg); }
  .note.mada { border-color: var(--line); } .note.mada .tag { color: var(--muted); background: var(--bar-bg); }
  .note b { font-size: 15px; }
  .note p { margin: 4px 0 0; font-size: 14px; }
  ul.plain { margin: 6px 0 0; padding-left: 1.2em; }
  ul.plain li { margin: 4px 0; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; background: var(--card); border-radius: 12px; overflow: hidden; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  thead th { background: var(--accent-soft); font-family: var(--font-display); }
  details.old { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; }
  details.old > summary { cursor: pointer; padding: 12px 16px; font-family: var(--font-display); font-weight: 700; }
  details.old > div { padding: 0 16px 16px; }
  .empty { color: var(--muted); font-size: 13px; }
  footer { margin-top: 32px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>使用状況の記録</h1>
  <p class="lead">子どものお薬サポートが、どれだけ・どう使われたか。見た日ごとにためる。見方は docs/26_shiyou_joukyou_mikata.md。数字には自分の確認の分も入る。</p>
  <nav class="links">
    <a href="https://clarity.microsoft.com/projects/view/z5py1akpjj/dashboard" target="_blank" rel="noopener">Clarity ダッシュボード</a>
    <a href="https://clarity.microsoft.com/projects/view/z5py1akpjj/impressions" target="_blank" rel="noopener">Clarity 録画</a>
    <a href="https://clarity.microsoft.com/projects/view/z5py1akpjj/heatmaps" target="_blank" rel="noopener">Clarity ヒートマップ</a>
    <a href="https://analytics.google.com/analytics/web/#/a414238281p561741887/reports/intelligenthome" target="_blank" rel="noopener">GA4 ホーム</a>
  </nav>

  <h2>日ごとの回数（Clarity の録画）</h2>

    <div class="legend"><span><i style="background:var(--s1)"></i>スマホ</span><span><i style="background:var(--s2)"></i>スマホ以外（PC・タブレットなど）</span></div>
    <div class="chart" id="daily-chart"></div>
    <div class="tip" id="daily-tip" role="status"></div>
    <p class="chart-note" id="daily-note"></p>
    <details class="table-view"><summary>表で見る</summary><div class="table-wrap" id="daily-table"></div></details>
  </div>

  <div id="latest"></div>

  <h2>推移</h2>
  <div class="table-wrap" id="trend"></div>

  <h2>前の記録</h2>
  <div id="older"></div>

  <footer>市区町村など、住んでいる所が分かる数字はここに書かない。考察は数が少ないうちは仮説として書く。</footer>
</main>

/* ===== 表示 ===== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sum = o => Object.values(o || {}).reduce((a, b) => a + b, 0);
const mobileRate = c => { const t = sum(c.device); return t ? Math.round(((c.device["スマホ"] || 0) / t) * 100) : null; };

function delta(now, prev) {
  if (now == null) return '<span class="delta first">今回は数字なし</span>';
  if (prev == null) return '<span class="delta first">前回なし</span>';
  const d = now - prev;
  if (d === 0) return '<span class="delta same">前回と同じ</span>';
  return d > 0 ? `<span class="delta up">▲ ${d}（前回 ${prev}）</span>` : `<span class="delta down">▼ ${-d}（前回 ${prev}）</span>`;
}

function tile(label, num, unit, sub, prev) {
  return `<div class="tile"><div class="label">${esc(label)}</div><div class="num">${num ?? "—"}<span class="unit">${esc(unit)}</span></div>${delta(num, prev)}<div class="sub">${esc(sub)}</div></div>`;
}

function bars(obj) {
  const entries = Array.isArray(obj) ? obj : Object.entries(obj || {});
  if (!entries.length) return '<p class="empty">記録なし</p>';
  const max = Math.max(...entries.map(e => e[1]));
  return '<div class="bars">' + entries.map(([name, n]) =>
    `<div class="bar-row"><span class="name" title="${esc(name)}">${esc(name)}</span><span class="bar-track"><span class="bar-fill" style="display:block;width:${max ? (n / max) * 100 : 0}%"></span></span><span class="n">${n}</span></div>`
  ).join("") + "</div>";
}

const KIND = { kasetsu: "仮説", kadai: "課題", mada: "まだ判断できない" };

function body(r) {
  const c = r.clarity || {}, g = r.ga4 || {};
  return `
    <div class="grid2">
      <div class="card"><h3>よく押されたボタン</h3><p class="period">${esc(r.clicksPeriod || "")}</p>${bars(r.clicks)}</div>
      <div class="card"><h3>どこから来たか（GA4）</h3><p class="period">${esc(g.period || "")}・訪問の回数</p>${bars(g.source)}
        <h3 style="margin-top:14px">端末（Clarity）</h3><p class="period">${esc(c.period || "")}・回数</p>${bars(c.device)}</div>
    </div>
    <div class="card"><h3>考察</h3>${(r.notes || []).map(n =>
      `<div class="note ${esc(n.kind)}"><span class="tag">${esc(KIND[n.kind] || n.kind)}</span><b>${esc(n.title)}</b><p>${esc(n.body)}</p></div>`).join("") || '<p class="empty">なし</p>'}</div>
    <div class="grid2">
      <div class="card"><h3>次にやること</h3><ul class="plain">${(r.next || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="card"><h3>Slack・週報で聞けること</h3><ul class="plain">${(r.questions || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
    </div>`;
}

function tiles(r, p) {
  const c = r.clarity || {}, g = r.ga4 || {}, pc = (p && p.clarity) || {}, pg = (p && p.ga4) || {};
  return `<div class="tiles">
    ${tile("Clarity 人数", c.users, "人", c.period || "", p ? pc.users : null)}
    ${tile("Clarity 回数", c.sessions, "回", c.period || "", p ? pc.sessions : null)}
    ${tile("GA4 人数", g.users, "人", g.period || "", p ? pg.users : null)}
    ${tile("GA4 表示回数", g.views, "回", g.period || "", p ? pg.views : null)}
  </div>`;
}

/* 日ごとの積み上げ棒グラフ。下がスマホ、上がスマホ以外。棒の上に合計。棒の列を押す・なぞると、くわしい数が出る */
function renderDaily() {
  // 画面の幅のまま描く（縮めると文字が小さくなるため）。日が増えて混んだら、日付は何日かおきに出す
  const box = document.getElementById("daily-chart");
  const W = Math.max(300, Math.round(box.clientWidth || 640)), H = W < 500 ? 210 : 240, L = 28, R = 8, T = 18, B = 26;
  const n = DAILY.length, max = Math.max(1, ...DAILY.map(r => r.all));
  const step = Math.max(5, Math.ceil(max / 4 / 5) * 5), top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const colW = (W - L - R) / n, barW = Math.min(36, colW * 0.62);
  const md = s => { const [, m, d] = s.split("-"); return `${+m}/${+d}`; };
  const every = Math.max(1, Math.ceil(36 / colW));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="日ごとの回数の棒グラフ。くわしい数は下の表で見られます">`;
  for (let v = 0; v <= top; v += step) {
    svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
    svg += `<text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  DAILY.forEach((r, i) => {
    const cx = L + colW * i + colW / 2, x = cx - barW / 2, other = r.all - r.mobile;
    const yMob = y(r.mobile), yAll = y(r.all), base = y(0);
    const seg = (y1, y2, color, roundTop) => {
      const h = Math.max(0, y2 - y1); if (h <= 0) return "";
      const rr = roundTop ? Math.min(4, h) : 0;
      return `<path d="M${x},${y2} V${y1 + rr} Q${x},${y1} ${x + rr},${y1} H${x + barW - rr} Q${x + barW},${y1} ${x + barW},${y1 + rr} V${y2} Z" fill="${color}"/>`;
    };
    svg += `<g class="col" tabindex="0" data-i="${i}" aria-label="${md(r.d)}: ${r.all}回、スマホ ${r.mobile}回">`;
    svg += `<rect class="hl" x="${L + colW * i + 1}" y="${T - 14}" width="${colW - 2}" height="${H - T - B + 14}" rx="6" fill="transparent"/>`;
    svg += seg(yMob, base, "var(--s1)", other === 0);
    if (other > 0) svg += seg(yAll, yMob - (r.mobile > 0 ? 2 : 0), "var(--s2)", true);
    svg += `<text class="total" x="${cx}" y="${yAll - 5}" text-anchor="middle">${r.all}</text>`;
    if ((n - 1 - i) % every === 0) svg += `<text class="axis" x="${cx}" y="${H - 8}" text-anchor="middle">${md(r.d)}</text>`;
    svg += "</g>";
  });
  svg += "</svg>";
  box.innerHTML = svg;

  const tip = document.getElementById("daily-tip"), card = box.closest(".chart-card");
  const show = g => {
    const r = DAILY[+g.dataset.i], marks = [["X", r.x], ["QR", r.qr], ["LINE", r.line]].filter(m => m[1] > 0);
    tip.innerHTML = `<b>${md(r.d)}　${r.all}回</b><br><i style="background:var(--s1)"></i>スマホ ${r.mobile}回<br><i style="background:var(--s2)"></i>スマホ以外 ${r.all - r.mobile}回` +
      (marks.length ? `<br>印つきリンク: ${marks.map(m => `${m[0]} ${m[1]}回`).join("・")}` : "");
    tip.style.display = "block";
    const gb = g.getBoundingClientRect(), cb = card.getBoundingClientRect();
    let left = gb.left - cb.left + gb.width / 2 - tip.offsetWidth / 2;
    left = Math.max(8, Math.min(left, cb.width - tip.offsetWidth - 8));
    tip.style.left = left + "px";
    tip.style.top = (gb.top - cb.top - tip.offsetHeight + 8) + "px";
  };
  box.querySelectorAll(".col").forEach(g => {
    g.addEventListener("mouseenter", () => show(g));
    g.addEventListener("focus", () => show(g));
    g.addEventListener("click", () => show(g));
    g.addEventListener("mouseleave", () => { tip.style.display = "none"; });
    g.addEventListener("blur", () => { tip.style.display = "none"; });
  });

  const sumAll = DAILY.reduce((a, r) => a + r.all, 0), sumMob = DAILY.reduce((a, r) => a + r.mobile, 0);
  document.getElementById("daily-note").textContent =
    `${md(DAILY[0].d)}〜${md(DAILY[n - 1].d)} の合計 ${sumAll}回（スマホ ${sumMob}回）。${DAILY_UPDATED} に数えた。手元の確認（localhost）は除き、自分のスマホ・PC の確認は含む。最後の日は途中まで。`;
  document.getElementById("daily-table").innerHTML =
    `<table><thead><tr><th>日</th><th>回数</th><th>スマホ</th><th>スマホ以外</th><th>X</th><th>QR</th><th>LINE</th></tr></thead><tbody>` +
    DAILY.map(r => `<tr><td>${md(r.d)}</td><td>${r.all}</td><td>${r.mobile}</td><td>${r.all - r.mobile}</td><td>${r.x}</td><td>${r.qr}</td><td>${r.line}</td></tr>`).join("") +
    "</tbody></table>";
}
renderDaily();

window.addEventListener("resize", () => { clearTimeout(dailyTimer); dailyTimer = setTimeout(renderDaily, 150); });

document.getElementById("latest").innerHTML = latest

  ["Clarity スマホの割合", r => { const m = r.clarity ? mobileRate(r.clarity) : null; return m == null ? null : m + "%"; }],
  ["Clarity 連打（3日）", r => r.clarity?.rage],
  ["GA4 人数（7日）", r => r.ga4?.users],
  ["GA4 表示回数（7日）", r => r.ga4?.views],
  ["GA4 X からの訪問", r => r.ga4?.source?.["X"]],
  ["GA4 平均の時間", r => r.ga4?.avgTime]
];
document.getElementById("trend").innerHTML =
  `<table><thead><tr><th>項目</th>${RECORDS.map(r => `<th>${esc(r.date.slice(5).replace("-", "/"))}</th>`).join("")}</tr></thead><tbody>` +
  rows.map(([label, f]) => `<tr><td>${esc(label)}</td>${RECORDS.map(r => `<td>${esc(f(r) ?? "—")}</td>`).join("")}</tr>`).join("") +
  "</tbody></table>";

document.getElementById("older").innerHTML = RECORDS.length > 1
  ? RECORDS.slice(1).map((r, i) => `<details class="old"><summary>${esc(r.date)}</summary><div>${tiles(r, RECORDS[i + 2])}${body(r)}</div></details>`).join("")
  : '<p class="empty">まだありません（2回目から、ここにたまります）</p>';
</script>
</body>
</html>
