<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>飲ませ方の画像</title>
<!-- 親が保存する「飲ませ方」の画像の元（2026-11-04。docs/18 の 7-1）
     card.html?age=toddler のように年齢を選ぶ。中身はサイトと同じ data.js から作るので、サイトの文を直せば画像も変わる
     手順は全部入れ、コツは題名だけ小さく出す。出どころと「医師・薬剤師に相談」は入れない（2026-11-03、11-04 ユーザーの判断）
     画像にするときは、幅 390 を3倍にする。高さは中身に合わせる -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  :root {
    --bg: #eef6f4;
    --ink: #17403b;
    --hero: #d9eee8;
    --card: #ffffff;
    --text: #1f2d2b;
    --muted: #5d6e6b;
    --line: #d3e3df;
    --accent: #1f7a70;
    --stamp: #e8a317;
    --best-bg: #fff2c4;
    --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    --font-body: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { background: var(--bg); }
  body {
    width: 390px;
    background: linear-gradient(180deg, var(--hero) 0, var(--bg) 160px);
    color: var(--text);
    font-family: var(--font-body);
  }
  .card {
    margin: 0 12px;
    padding: 34px 0 16px;
    position: relative;
  }
  .stamp {
    position: absolute;
    top: 18px;
    right: 4px;
    width: 58px;
    height: 58px;
    border: 4px solid var(--stamp);
    border-radius: 50%;
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    transform: rotate(-12deg);
  }
  .eyebrow { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 12px; color: var(--accent); letter-spacing: 0.06em; }
  h1 { margin: 2px 0 14px; font-family: var(--font-display); font-weight: 700; font-size: 23px; line-height: 1.25; color: var(--ink); }
  h2 { margin: 14px 2px 6px; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--accent); }
  .way {
    background: var(--card);
    border-radius: 14px;
    padding: 10px 12px 10px;
    margin-bottom: 8px;
    box-shadow: 0 2px 0 var(--line);
  }
  .way.hard { background: var(--best-bg); box-shadow: none; }
  .way b { display: block; font-size: 15px; color: var(--ink); margin-bottom: 4px; }
  .way ol { margin: 0; padding-left: 1.35em; }
  .way li { font-size: 12.5px; line-height: 1.55; margin: 2px 0; }
  .way li::marker { color: var(--accent); font-weight: bold; }
  /* コツは縦の箇条書きにする（2026-11-04 ユーザーの指示。前は横に並べた札） */
  .tips { margin: 0; padding-left: 1.4em; }
  .tips li { font-size: 12.5px; font-weight: bold; color: var(--ink); line-height: 1.6; margin: 2px 0; }
  .tips li::marker { color: var(--accent); }
  /* 1つのやり方だけのとき（way= があるとき）は、文字を大きくする */
  .one .eyebrow { font-size: 13px; line-height: 1.6; }
  .one h1 { font-size: 26px; margin: 12px 0 16px; }
  .one .way { padding: 10px 16px 12px; }
  .one .way b { display: none; }
  .one .way li { font-size: 16px; line-height: 1.65; margin: 8px 0; }
  .one .tips li { font-size: 15px; margin: 4px 0; }
  .foot { margin-top: 14px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 10.5px; color: var(--muted); }
</style>
</head>
<body>
  <div class="card" id="card"></div>
  <script src="../data.js"></script>
  <script>
    // サイトの文のうち、画像では押せないボタンの話を言いかえる
    const IMAGE_WORDS = [["下のボタンから", "サイトで"]];
    function fix(s) { return IMAGE_WORDS.reduce((t, [a, b]) => t.replaceAll(a, b), s); }

    const q = new URLSearchParams(location.search);
    const age = q.get("age") || "toddler";
    // way= をつけると、そのやり方だけを詳しく出す（2026-11-04 ユーザーの指示。全部入れると文字が多すぎた）
    const only = q.get("way");
    const f = AGE_FLOWS.find((x) => x.age === age);
    // 口直しは、手順の中にもあるので、コツからは外す
    // 服薬ゼリーは、コツではなく別のやり方なので外す。お薬だんごの画像に出ると、おかしい（2026-11-04 ユーザーの指示）
    const NOT_TIPS = ["口直し", "服薬ゼリー"];
    const tips = HOWTO.filter((h) => (h.ages.includes(age) || h.ages.includes("all")) && !NOT_TIPS.some((w) => h.title.includes(w)));

    const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const way = (key, hard) => {
      const m = METHODS[key];
      const name = m.title.replace("おすすめの飲ませ方: ", "");
      return `<div class="way${hard ? " hard" : ""}"><b>${m.icon} ${esc(name)}</b><ol>${m.steps.map((s) => `<li>${esc(fix(s))}</li>`).join("")}</ol></div>`;
    };

    const card = document.getElementById("card");
    card.classList.toggle("one", !!only);
    const body = only
      ? way(only, false)
      : f.groups.map((g) => `<h2>${esc(g.label)}</h2>${g.items.map((k) => way(k, g.label.includes("難しい"))).join("")}`).join("");
    // 1つのやり方だけのときは、やり方の名前を見出しにする
    const m = only && METHODS[only];
    card.innerHTML = `
      <div class="stamp" aria-hidden="true">🐻</div>
      <p class="eyebrow">子どものお薬サポート${only ? `<br>${esc(f.label)}の粉薬の飲ませ方` : ""}</p>
      <h1>${only ? `${m.icon} ${esc(m.title.replace("おすすめの飲ませ方: ", ""))}` : `${esc(f.label)}の粉薬の飲ませ方`}</h1>
      ${body}
      <h2>コツ</h2>
      <ul class="tips">${[...(only && METHODS[only].tips || []), ...tips.map((h) => h.title)].map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
      <div class="foot">koshihara-pharm.github.io/boot_camp/</div>`;
    // 画像にするときの高さ（make.cjs が読む）
    document.fonts.ready.then(() => { document.body.dataset.h = Math.ceil(card.getBoundingClientRect().bottom + 8); });
  </script>
</body>
</html>
